version: "0.1"
max_int_bits: 65536
min_int_bits: 64
max_depth: 1000
test_output_bytes: 1048576
property_cases: 100
memory:
  record_or_choice: "1 + fields"
  fresh_collection: "1 + elements"
  derived_collection: "1 + added"
  mutable_push: 1
  new_mutable: 1
  text_or_bytes: "1 + ceil(bytes / 8)"
  big_int: "ceil(bit_length / 64) when bit_length > 64"
  lambda: "1 + captured"
